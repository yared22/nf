<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hover-interactive wave</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #fafafa;
      }
      .hover-lottie {
        width: 320px;
        height: 252px;
        cursor: pointer;
      }
      .hover-lottie canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      .hint {
        margin-top: 12px;
        color: #777;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="hover-lottie" id="wave" tabindex="0">
        <canvas></canvas>
      </div>
      <p class="hint">Hover the robot to make it wave and say hello.</p>
    </div>

    <script type="module">
      import { DotLottie } from 'https://esm.sh/@lottiefiles/dotlottie-web@0.40.2';

      const container = document.getElementById('wave');

      const player = new DotLottie({
        canvas: container.querySelector('canvas'),
        src: './wave.lottie',
        loop: true,
        autoplay: false,
      });

      // Rewinding on enter guarantees the wave always starts from the beginning,
      // and stop() rewinds to frame 0 so the "Hello" bubble disappears on leave.
      const start = () => {
        player.setFrame(0);
        player.play();
      };
      const reset = () => player.stop();

      container.addEventListener('mouseenter', start);
      container.addEventListener('mouseleave', reset);
      container.addEventListener('focus', start);
      container.addEventListener('blur', reset);
    </script>
  </body>
</html>
